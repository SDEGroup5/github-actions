name: Docker Image

on:
  push
# TODO: Change

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build app-only stage to a local directory
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.build
          target: app-only
          platforms: linux/amd64
          outputs: type=local,dest=./app-only-context

      - name: Log in GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image version
        id: image-version
        # If it's a release, use the tag as the version,
        # otherwise use the short SHA of the commit
        run: |
          image_repository=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "image_repository=$image_repository" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            echo "image_version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "image_version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi
        
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.app
          build-contexts: app-only=./app-only-context
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ steps.image-version.outputs.image_repository }}/app:${{ steps.image-version.outputs.image_version }}
