services:
    app:
        build:
            context: ./app
            dockerfile: Dockerfile.app
        image: app:latest
        container_name: app
        ports:
        - "5000:5000"
        networks:
        - github-action-network
        secrets:
            - my_secret

networks:
    github-action-network:
        driver: bridge

secrets:
    my_secret:
        file: .env

volumes:
    my_volume:
        driver: local
