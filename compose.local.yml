services:
    app:
        build:
            context: .
            dockerfile: Dockerfile.app
        image: app:latest
        container_name: app
        ports:
        - "5000:5000"
        networks:
        - github-action-network
        secrets:
            - my_secret
        volumes:
            - ./json/data.json:/app/json/data.json:rw

networks:
    github-action-network:
        driver: bridge

secrets:
    my_secret:
        file: .env
