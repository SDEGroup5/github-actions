[project]
name = "github-action"
version = "0.0.1"
description = "A project to show how Github Action works."
authors = [
    {name = "LorenzoCaraffini"},
    {name = "FilizZPalm"},
    {name = "ozneroL541"},
    {name = "Oziator"},
    {name = "FireStoat3"}
]
license = "GNU GPLv3"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    {include = "src"},
]



[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "UP", "I", "N"]

[tool.pytest.ini_options]
testpaths = ["test/*.py"]

[tool.pylint.main]
ignore = [
    ".venv",
    ".github"
]

source-roots = ["."]
# Pylint 4.0.7 crashes in this checker with Python 3.14.
disable = ["variables"]
