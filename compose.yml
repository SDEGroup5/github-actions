services:
    app:
        # TODO: Change the image to your own image
        image: ghcr.io/sdegroup5/github-actions/app:latest
        container_name: github-action-app
        ports:
        - "5000:5000"
        networks:
        - github-action-network
        secrets:
            - my_secret
        volumes:
            - ./json/data.json:/app/json/data.json:rw

networks:
    github-action-network:
        driver: bridge

secrets:
    my_secret:
        file: .env
