services:
    backend:
        image: ghcr.io/sdegroup5/github-actions/backend:latest
        container_name: backend
        ports:
        - "5000:5000"
        networks:
        - github-action-network
        secrets:
            - my_secret
        depends_on:
            - database

    
    frontend:
        image: ghcr.io/sdegroup5/github-actions/frontend:latest
        container_name: frontend
        ports:
        - "3000:3000"
        networks:
        - github-action-network
    database:
        image: postgres:15.3-alpine
        container_name: database
        env_file:
        - .env
        ports:
        - "5432:5432"
        networks:
        - github-action-network
networks:
    github-action-network:
        driver: bridge

secrets:
    my_secret:
        file: .env

volumes:
    my_volume:
        driver: local
